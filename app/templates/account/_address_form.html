<form method="post" action="{{ url_for('account.addresses') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if a %}<input type="hidden" name="address_id" value="{{ a.id }}">{% endif %}
  <div class="row g-2">
    <div class="col-md-4"><input class="form-control" name="label" placeholder="Label (Home, Office)" value="{{ a.label if a else '' }}"></div>
    <div class="col-md-4"><input class="form-control" name="full_name" placeholder="Full name" value="{{ a.full_name if a else current_user.name }}" required></div>
    <div class="col-md-4"><input class="form-control" name="phone" placeholder="Phone" value="{{ a.phone if a else current_user.phone }}" required></div>
    <div class="col-md-8"><input class="form-control" name="line1" placeholder="Street address" value="{{ a.line1 if a else '' }}" required></div>
    <div class="col-md-4"><input class="form-control" name="line2" placeholder="Apt / suite" value="{{ (a.line2 or '') if a else '' }}"></div>
    <div class="col-md-5"><input class="form-control" name="city" placeholder="City" value="{{ a.city if a else '' }}" required></div>
    <div class="col-md-4"><input class="form-control" name="state" placeholder="State" value="{{ a.state if a else '' }}" required></div>
    <div class="col-md-3"><input class="form-control" name="zip_code" placeholder="ZIP" value="{{ a.zip_code if a else '' }}" required></div>
  </div>
  <div class="d-flex justify-content-between align-items-center mt-2">
    <div class="form-check"><input class="form-check-input" type="checkbox" name="is_default" value="1" id="def{{ a.id if a else 'new' }}" {% if a and a.is_default %}checked{% endif %}>
      <label class="form-check-label" for="def{{ a.id if a else 'new' }}">Default address</label></div>
    <button class="btn btn-saffron btn-sm">{{ 'Save' if a else 'Add address' }}</button>
  </div>
</form>
