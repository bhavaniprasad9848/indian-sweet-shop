{% extends "base.html" %}
{% block content %}
<section class="page-banner slim"><div class="container">
  <span class="eyebrow light">नमस्ते, {{ current_user.name.split()[0] }}</span><h1>{% block heading %}My account{% endblock %}</h1>
</div></section>
<div class="container section pt-4">
  <div class="row g-4">
    <aside class="col-lg-3">
      <nav class="account-nav">
        {% set ep = request.endpoint %}
        <a href="{{ url_for('account.profile') }}" class="{{ 'active' if ep == 'account.profile' }}"><i class="bi bi-person"></i> Profile</a>
        <a href="{{ url_for('account.orders') }}" class="{{ 'active' if ep in ('account.orders','account.order_detail') }}"><i class="bi bi-receipt"></i> Orders</a>
        <a href="{{ url_for('account.addresses') }}" class="{{ 'active' if ep == 'account.addresses' }}"><i class="bi bi-geo-alt"></i> Addresses</a>
        <a href="{{ url_for('cart.view') }}"><i class="bi bi-bag"></i> Cart</a>
      </nav>
    </aside>
    <div class="col-lg-9">{% block account_body %}{% endblock %}</div>
  </div>
</div>
{% endblock %}
