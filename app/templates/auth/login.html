{% extends "auth/_layout.html" %}
{% block title %}Sign in{% endblock %}
{% block auth_body %}
<span class="eyebrow">Customer sign in</span>
<h1 class="auth-title">Welcome back</h1>
<p class="text-muted">Sign in with your password — we'll then email you a one-time code.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
  <div class="form-floating mb-3">
    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" value="{{ email }}" required autofocus>
    <label for="email">Email address</label>
  </div>
  <div class="form-floating mb-3 pw-wrap">
    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
    <label for="password">Password</label>
    <button type="button" class="pw-toggle" data-toggle-pw="#password" aria-label="Show password"><i class="bi bi-eye"></i></button>
  </div>
  <button class="btn btn-saffron btn-lg w-100">Continue <i class="bi bi-arrow-right"></i></button>
</form>
<p class="mt-4 text-center">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
<p class="text-center small"><a class="text-muted" href="{{ url_for('auth.admin_login') }}"><i class="bi bi-shield-lock"></i> Shop staff? Use the admin portal</a></p>
{% endblock %}
