# Render Blueprint — New → Blueprint → pick this repo.
services:
  - type: web
    name: shree-mithai-mahal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: DATABASE_URL          # paste your Neon connection string when Render asks
        sync: false
      - key: STORE_TIMEZONE
        value: America/Chicago
      - key: PAYMENT_GATEWAY
        value: simulated
      # Shows the OTP on screen only while no email delivery (BREVO_API_KEY) is configured.
      # Set to "false" once Brevo is working.
      - key: SHOW_DEV_OTP
        value: "true"
      - key: BREVO_API_KEY         # email over HTTPS — Render free plan blocks SMTP
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
